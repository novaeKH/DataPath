[package]
name = "datapath-desktop"
version = "1.0.0"
description = "DataPath desktop shell"
edition = "2021"

[lib]
name = "datapath_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-window-state = "2"
