name: Verify release

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend-and-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install Python 3.12
        run: uv python install 3.12
      - name: Install locked backend dependencies
        run: uv sync --directory backend --frozen
      - name: Sync and validate content
        run: make sync-content validate-content
      - name: Backend tests
        run: cd backend && uv run pytest
      - name: Ruff
        run: cd backend && uv run ruff check app tests alembic && uv run ruff format --check app tests alembic

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Frontend tests
        run: npm run test
        working-directory: frontend
      - name: TypeScript, ESLint and Prettier
        run: npx tsc -b && npm run lint && npm run format:check
        working-directory: frontend
      - name: Production web build
        run: npm run build
        working-directory: frontend
